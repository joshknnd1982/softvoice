name = svWebspeak
summary = "SoftVoice (self-contained)"
description = """The SoftVoice formant synthesizer (SVCTL32, 1997) as a fully self-contained NVDA add-on. The 32-bit engine runs in a dedicated host process and streams audio to NVDA. All 20 SoftVoice personalities, English and Spanish, and every synthesis parameter are exposed in NVDA's Speech settings. Nothing is written to or read from the Windows registry: the engine is registered in-process by the add-on itself, so there is no sv_license.reg to install. Compatible with 32-bit and 64-bit NVDA."""
author = "Josh Kennedy <joshknnd1982@gmail.com>"
url = https://github.com/joshknnd1982/softvoice
version = 2026.1.1
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.1
updateChannel = None
